# file: prj.conf | zephyr kernel config | rp2350 full os profile

# --- threading / scheduler ---
CONFIG_MULTITHREADING=y
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- usb stack (cdc-acm) ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="RP2350 Zephyr OS"
CONFIG_USB_DEVICE_VID=0x2e8a
CONFIG_USB_DEVICE_PID=0x000a
CONFIG_USB_CDC_ACM=y

# --- console over usb ---
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# --- interactive shell ("os" feel: ls/ps/kernel stats/etc) ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096

# --- filesystem on internal flash (littlefs) ---

# --- logging subsystem ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# --- gpio for onboard led / status ---
CONFIG_GPIO=y

# --- stdc / newlib for shell string ops ---
CONFIG_PICOLIBC=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
